# Ruff — lint and format for every Python file in the repository (today: the plugin's and the desktop's scripts).
# One root config so a new package's Python is covered without opting in.
line-length = 100
target-version = "py39"   # the floor plugins/author-tools/pyproject.toml declares

[lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade. E501 is the formatter's job, not the linter's.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
