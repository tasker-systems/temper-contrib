# The ACP agent roster: launch presets for the agents most people run, as data.
#
# Source of truth: the ACP site's agent list, https://agentclientprotocol.com/get-started/agents
# (each entry names its page there). Nothing here is verified to speak ACP on this machine —
# the desktop never tests the protocol; launching is the proof. The roster only proposes what
# is most common, so a person whose agent binary is on $PATH selects it instead of typing its
# launch command by hand.
#
# `binary` is the name probed on $PATH. `command` is the launch command the store receives,
# parsed the way the ACP crate parses command strings. Agents that speak ACP natively probe
# and launch their binary directly (`opencode`, `agent`, `gemini`).
#
# Harnesses that do not speak ACP natively launch through a bundled adapter: the desktop
# ships the JS shim (pinned in `apps/desktop/package.json`, staged by
# `scripts/build-adapters.sh`, resolved by `adapters.rs`). Those rows probe the harness CLI
# the adapter wraps (`claude`, `codex`, `agy`) — an adapter without its harness launches
# nothing — and their `command` carries the `{{adapter:<key>}}` marker that `adapters.rs`
# renders at spawn time into `<node|bun> <bundled entry>` plus the env var pointing the
# adapter at the probed CLI. Adapter versions are bun.lock's, never this file's.

[[agents]]
key = "opencode"
label = "OpenCode"
binary = "opencode"
command = "opencode acp"
# https://opencode.ai/docs/acp — "run the `opencode acp` command"

[[agents]]
key = "cursor"
label = "Cursor CLI"
binary = "agent"
command = "agent acp"
# https://cursor.com/docs/cli/acp — "Start Cursor CLI in ACP mode: agent acp"

[[agents]]
key = "gemini"
label = "Gemini CLI"
binary = "gemini"
command = "gemini --acp"
# https://geminicli.com — `gemini --acp` (the `experimental-acp` flag is deprecated in favour of `--acp`)

[[agents]]
key = "codex"
label = "Codex CLI"
binary = "codex"
command = "node {{adapter:codex}}"
# https://github.com/agentclientprotocol/codex-acp — the ACP adapter; wraps the person's own
# `codex` CLI (resolved over CODEX_PATH at launch), versioned with the app via bun.lock

[[agents]]
key = "claude"
label = "Claude Agent"
binary = "claude"
command = "node {{adapter:claude}}"
# https://github.com/agentclientprotocol/claude-agent-acp — the ACP adapter for the Claude
# Agent SDK; wraps the person's own `claude` CLI (CLAUDE_CODE_EXECUTABLE at launch)

[[agents]]
key = "antigravity"
label = "Antigravity CLI"
binary = "agy"
command = "node {{adapter:antigravity}}"
# https://github.com/shindgew/agy-acp — ACP adapter wrapping the Google Antigravity CLI
# (agy); AGY_BIN points it at the probed binary at launch. (The adapter also carries an
# upstream install-on-missing path — unreachable from this row, since the probe above
# already gates the offer on agy being present.)
