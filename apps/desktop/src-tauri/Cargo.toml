[package]
name = "desktop"
version = "0.1.0"
description = "Temper Desktop"
edition = "2021"
# An application, never published to a registry.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
temperkb-client = "0.6"
temperkb-core = "0.6"
temperkb-workflow = "0.6"
# The desktop's temper credential lives in the platform keychain (the macOS
# Security framework through the default v1 store); the stored payload is the
# client crate's own StoredAuth JSON.
keyring = "4.2.0"
uuid = "1"
chrono = "0.4"
# The fresh-machine establish's default vault path: the same `dirs::home_dir`
# resolution `temper init`'s `default_vault_path` makes (temper-cli pins
# major 5), so the desktop's default is init's default, byte for byte.
dirs = "7"
similar = { version = "3", features = ["inline"] }
regex = "1"
toml = "1.1"
# Format-preserving `[auth]` merge into the CLI-shared config.toml: the desktop
# touches its section and leaves every other byte (comments, foreign sections)
# as the file carries them.
toml_edit = "0.25"
tauri-plugin-opener = "2.5.5"
agent-client-protocol = { version = "3.2.0", features = ["process"] }
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "macros", "time"] }
# The presentation probe's MCP server: the same dependency shape temper-mcp runs,
# so the harness-fidelity probe serves the closed catalog exactly as core serves its tools.
rmcp = { version = "3.4.1", features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", features = ["json"] }
http = "1"
# The probe's tool-args derive: the projected catalog schema is hand-written,
# but `Parameters` demands the derive exist on the args type.
schemars = "1"
# The core's own check of a presented spec before it is recorded, against the
# same projected catalog schema the server advertises. Already in the graph
# through temperkb-workflow.
jsonschema = "0.59"
# The embedded WebDriver server the CSP witness drives on macOS, where tauri-driver has no
# WKWebView driver. Behind a feature: the witness builds with `--features webdriver`, so
# development and release builds never compile an endpoint.
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[features]
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
# The close guard's witnesses drive a real window through tauri's MockRuntime.
tauri = { version = "2", features = ["test"] }
# The presentation server's live-bind gate talks HTTP to itself.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# The stub authority the live sign-in witnesses run against mints access
# tokens in the JWT shape the published flow parses mechanically.
base64 = "0.23"

# The tasker-systems canonical lint table (rust/workspace-lints.toml in the baseline projected at
# .conventions/baseline), as this single package's own `[lints]`. `conventions.py check` fails if it
# differs from the projection without a recorded exception. CI runs clippy and rustdoc with
# `-D warnings`, so each `warn` here fails the build.
[lints.rust]
# RUST-UNSAFE-1/2: every crate root also declares `#![forbid(unsafe_code)]`. A crate with a
# registered exception omits the `forbid`, and this `deny` makes each of its unsafe sites carry
# `#[expect(unsafe_code, reason = "...")]`. A tripwire pins both sets.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
# RUST-TYPE-1.
missing_debug_implementations = "warn"
redundant_imports = "warn"
# A crate using tokio-console's `--cfg tokio_unstable` (tasker-core's spawn_named!) extends this list
# in its own copy; the shape is: check-cfg = ['cfg(tokio_unstable)'].
unexpected_cfgs = { level = "warn", check-cfg = [] }

[lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# RUST-LINT-3: silence with #[expect(lint, reason = "...")] only.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# RUST-UNSAFE-2: every unsafe block states its safety argument.
undocumented_unsafe_blocks = "warn"

dbg_macro = "warn"
# CONC-BOUND-1 is enforced through `disallowed_methods`, which is on by default and configured in
# clippy.toml; it is named here so the dependency is visible.
disallowed_methods = "warn"

# Permanent exceptions in the `cargo` group:
# Duplicate versions are pervasive and reported by cargo-deny's `bans` (SC-DENY-3) instead.
multiple_crate_versions = "allow"

# RUST-LINT-5 / RUST-API-3, -4, -5: single lints from the held-off style/complexity groups that
# hold a written rule. Measured 2026-10-23 on lib and bin targets with clippy 1.99: 0 findings in
# temper@d530840 and in tasker-core@3888d42, so each lands without an audit.
ptr_arg = "warn"
borrowed_box = "warn"
should_implement_trait = "warn"
derivable_impls = "warn"
new_without_default = "warn"
len_without_is_empty = "warn"
wrong_self_convention = "warn"
unnecessary_unwrap = "warn"

# Candidates with findings, held until each repo's audit (RUST-LINT-4). Counts are lib and bin
# targets, 2026-10-23, temper / tasker-core. Each needs the clippy.toml setting beside it.
# wildcard_imports = "warn"     # RUST-ORG-1:  4 / 26
# unwrap_used = "warn"          # RUST-ERR-4: 11 / 76 (clippy.toml: allow-unwrap-in-tests = true)
# missing_panics_doc = "warn"   # RUST-DOC-1: 25 / 25 (library crates only)

# Held off in v0. Turning any on is a ruling, adopted per RUST-LINT-4.
# complexity = { level = "warn", priority = -1 }
# perf       = { level = "warn", priority = -1 }
# style      = { level = "warn", priority = -1 }
# pedantic   = { level = "warn", priority = -1 }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
