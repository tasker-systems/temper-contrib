name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A weekly full-battery run on main: the drift a diff-based gate cannot see — runner image,
  # WebKitGTK, tauri-driver — shows up here, named by the job that moved.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Job names are the status-check contexts the branch ruleset matches EXACTLY: renaming one strands
# the ruleset on a context that never reports. `CI Success` (the last job) fans every job in, so
# the ruleset can require that one context and new jobs join the gate without a settings change.
#
# Every gate here is also a cargo-make task (Makefile.toml): `cargo make check` and
# `cargo make test` run this same battery locally.

jobs:
  verify:
    name: Plugin checks (schemas + lint self-check + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validators
        run: |
          pip install uv
          cd plugins/author-tools && uv sync
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Parse-check scripts
        run: bash -n plugins/author-tools/scripts/*.sh

      - name: Shellcheck scripts
        run: shellcheck plugins/author-tools/scripts/*.sh

      - name: Lint self-check
        run: ./plugins/author-tools/scripts/lint.sh --self-check

  themes:
    name: Theme checks (contract + contrast + generated CSS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validators
        run: |
          pip install uv
          cd themes && uv sync
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Parse-check and shellcheck scripts
        run: |
          bash -n themes/scripts/themes.sh
          shellcheck themes/scripts/themes.sh

      - name: Theme self-check
        run: ./themes/scripts/themes.sh --self-check

  desktop:
    name: Desktop (frontend + cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        # --verbose: adapter native modules (better-sqlite3, node-pty) run
        # install scripts; a failing one's stderr is otherwise invisible in
        # the job log.
        run: bun install --frozen-lockfile --verbose
        working-directory: apps/desktop

      - name: Biome (lint + format + imports)
        run: bun run lint
        working-directory: apps/desktop

      - name: Svelte check
        run: bun run check
        working-directory: apps/desktop

      - name: Unit and component tests
        run: bun run test
        working-directory: apps/desktop

      - name: No literal colours under src/
        run: bun run guard:colours
        working-directory: apps/desktop

      - name: Build frontend
        run: bun run build
        working-directory: apps/desktop

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Rustfmt
        run: cargo fmt --all -- --check
        working-directory: apps/desktop/src-tauri

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: apps/desktop/src-tauri

      - name: Cargo test
        run: cargo test
        working-directory: apps/desktop/src-tauri

      - name: Rustdoc (warnings are errors)
        run: cargo doc --no-deps --document-private-items
        working-directory: apps/desktop/src-tauri
        env:
          RUSTDOCFLAGS: -D warnings

  hygiene:
    name: Repo hygiene (secrets + python + shell + workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      ACTIONLINT_VERSION: 1.7.7
      RUFF_VERSION: 0.15.8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pinned by version and verified by checksum: a changed release asset fails the download
      # instead of scanning.
      - name: Install gitleaks and actionlint (checksum-verified)
        run: |
          cd /tmp
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSLO "$base/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          sudo install -m 0755 gitleaks actionlint /usr/local/bin/
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Secret scan (tracked content)
        run: gitleaks dir . -c .gitleaks.toml --no-banner --redact -v

      - uses: astral-sh/setup-uv@v7

      - name: Ruff (lint + format)
        run: |
          uvx "ruff@${RUFF_VERSION}" check .
          uvx "ruff@${RUFF_VERSION}" format --check .

      - name: Shell (bash -n + shellcheck, every tracked script and githook)
        run: |
          mapfile -t files < <(git ls-files '*.sh' 'githooks/*')
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck "${files[@]}"

      - name: Workflows (actionlint)
        run: actionlint

  witness-gate:
    name: CSP witness gate (what the diff can move)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      desktop: ${{ steps.gate.outputs.desktop }}
    # Everything on main — pushes and the weekly run — witnesses; a PR pays for the
    # witness only when its diff can move what the witness guards: the app (its config,
    # its code, its install surface) or the witness's own scripts.
    steps:
      - uses: actions/checkout@v7

      - id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout's refspec is scoped to the PR's ref, so main must be named onto its
          # tracking ref explicitly — fetched bare, `origin/main` never comes into existence
          # and the diff below would fatal into a silent "not relevant".
          git fetch --quiet --no-tags --depth=1 origin "main:refs/remotes/origin/main"
          # A direct tree diff of main against the merge ref: no merge-base, so a shallow
          # graph cannot turn into a decision by accident.
          if ! git diff --name-only "origin/main" HEAD > /tmp/witness-diff.txt 2>/tmp/witness-diff.err; then
            echo "::error::the witness gate could not diff against main: $(cat /tmp/witness-diff.err)"
            exit 1
          fi
          # A diff of nothing decides nothing; an undecidable gate refuses rather than exclude.
          if [ ! -s /tmp/witness-diff.txt ]; then
            echo "::error::the witness gate diffed against main and saw no changed files"
            exit 1
          fi
          if grep -qE '^apps/desktop/|^\.github/workflows/ci\.yml$' /tmp/witness-diff.txt; then
            echo "witness gate: desktop changes — the witness runs"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "witness gate: nothing the witness guards — skipped"
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  csp-witness:
    name: Desktop CSP witness (production build in WebKitGTK)
    needs: witness-gate
    if: needs.witness-gate.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Tauri prerequisites, WebKitWebDriver and Xvfb
        run: |
          sudo apt-get update
          # dbus: WebKitGTK's automation engages over the session bus — without one the
          # session is created and no command ever answers. The image also restricts
          # unprivileged user namespaces (bwrap cannot set up its uid map), which stops the
          # WebView's sandboxed processes from ever launching; the witness needs them, so
          # the job lifts the restriction on its own runner.
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb dbus
          echo "apparmor_restrict_unprivileged_userns: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 'n/a')"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --proc /proc --dev /dev true && echo "bwrap: ok" || echo "bwrap: still failed"

      # The cache must not cross runner images: artifacts built by one image's rustc are
      # useless to another, and a shared key restores fingerprints cargo trusts while the
      # crates they name are missing (E0463, no dependency lines in the log).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - uses: astral-sh/setup-uv@v7

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/desktop

      # The shipped policy, in the shipped engine: a production build (never the dev server,
      # whose devCsp is looser by design) driven through tauri-driver. Fails when a route raises
      # a violation or when any injection probe is not refused.
      - name: Build and witness
        run: |
          bun run tauri build --debug --no-bundle
          # WEBKIT_DEBUG carries WebKit's own automation-channel words into the captured
          # output — what the session said while it was not answering.
          WEBKIT_DEBUG=Automation xvfb-run -a dbus-run-session -- uv run -q --with 'selenium>=4.20,<5' scripts/csp-witness.py
        working-directory: apps/desktop

  ci-success:
    name: CI Success
    if: always()
    needs: [verify, themes, desktop, hygiene, witness-gate, csp-witness]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded; a skipped job was gated off
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          GATED: ${{ needs.witness-gate.outputs.desktop }}
        run: |
          echo "job results: $RESULTS (witness gate: $GATED)"
          # A skip is legitimate only when the path gate excluded the witness; every other
          # non-success fails the fan-in.
          for r in $RESULTS; do
            [ "$r" = "success" ] && continue
            if [ "$r" = "skipped" ] && [ "$GATED" = "false" ]; then continue; fi
            echo "::error::a required job finished '$r' (witness gate: $GATED)"
            exit 1
          done
