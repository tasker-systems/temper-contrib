name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Job names are the status-check contexts the branch ruleset matches EXACTLY: renaming one strands
# the ruleset on a context that never reports. `CI Success` (the last job) fans every job in, so
# the ruleset can require that one context and new jobs join the gate without a settings change.
#
# Every gate here is also a cargo-make task (Makefile.toml): `cargo make check` and
# `cargo make test` run this same battery locally.

jobs:
  verify:
    name: Plugin checks (schemas + lint self-check + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validators
        run: |
          pip install uv
          cd plugins/author-tools && uv sync
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Parse-check scripts
        run: bash -n plugins/author-tools/scripts/*.sh

      - name: Shellcheck scripts
        run: shellcheck plugins/author-tools/scripts/*.sh

      - name: Lint self-check
        run: ./plugins/author-tools/scripts/lint.sh --self-check

  themes:
    name: Theme checks (contract + contrast + generated CSS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validators
        run: |
          pip install uv
          cd themes && uv sync
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Parse-check and shellcheck scripts
        run: |
          bash -n themes/scripts/themes.sh
          shellcheck themes/scripts/themes.sh

      - name: Theme self-check
        run: ./themes/scripts/themes.sh --self-check

  desktop:
    name: Desktop (frontend + cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Biome (lint + format + imports)
        run: npm run lint
        working-directory: apps/desktop

      - name: Svelte check
        run: npm run check
        working-directory: apps/desktop

      - name: Unit and component tests
        run: npm test
        working-directory: apps/desktop

      - name: No literal colours under src/
        run: npm run guard:colours
        working-directory: apps/desktop

      - name: Build frontend
        run: npm run build
        working-directory: apps/desktop

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Rustfmt
        run: cargo fmt --all -- --check
        working-directory: apps/desktop/src-tauri

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: apps/desktop/src-tauri

      - name: Cargo test
        run: cargo test
        working-directory: apps/desktop/src-tauri

      - name: Rustdoc (warnings are errors)
        run: cargo doc --no-deps --document-private-items
        working-directory: apps/desktop/src-tauri
        env:
          RUSTDOCFLAGS: -D warnings

  hygiene:
    name: Repo hygiene (secrets + python + shell + workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      ACTIONLINT_VERSION: 1.7.7
      RUFF_VERSION: 0.15.8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pinned by version and verified by checksum: a changed release asset fails the download
      # instead of scanning.
      - name: Install gitleaks and actionlint (checksum-verified)
        run: |
          cd /tmp
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSLO "$base/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          sudo install -m 0755 gitleaks actionlint /usr/local/bin/
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Secret scan (tracked content)
        run: gitleaks dir . -c .gitleaks.toml --no-banner --redact -v

      - uses: astral-sh/setup-uv@v7

      - name: Ruff (lint + format)
        run: |
          uvx "ruff@${RUFF_VERSION}" check .
          uvx "ruff@${RUFF_VERSION}" format --check .

      - name: Shell (bash -n + shellcheck, every tracked script and githook)
        run: |
          mapfile -t files < <(git ls-files '*.sh' 'githooks/*')
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck "${files[@]}"

      - name: Workflows (actionlint)
        run: actionlint

  csp-witness:
    name: Desktop CSP witness (production build in WebKitGTK)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Tauri prerequisites, WebKitWebDriver and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - uses: astral-sh/setup-uv@v6

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      # The shipped policy, in the shipped engine: a production build (never the dev server,
      # whose devCsp is looser by design) driven through tauri-driver. Fails when a route raises
      # a violation or when any injection probe is not refused.
      - name: Build and witness
        run: |
          npx tauri build --debug --no-bundle
          xvfb-run -a uv run -q --with 'selenium>=4.20,<5' scripts/csp-witness.py
        working-directory: apps/desktop

  ci-success:
    name: CI Success
    if: always()
    needs: [verify, themes, desktop, hygiene, csp-witness]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::a required job finished '$r'"; exit 1; }
          done
