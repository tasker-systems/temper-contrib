name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Plugin checks (schemas + lint self-check + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validators
        run: |
          pip install uv
          cd plugins/author-tools && uv sync
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Parse-check scripts
        run: bash -n plugins/author-tools/scripts/*.sh

      - name: Shellcheck scripts
        run: shellcheck plugins/author-tools/scripts/*.sh

      - name: Lint self-check
        run: ./plugins/author-tools/scripts/lint.sh --self-check

  themes:
    name: Theme checks (contract + contrast + generated CSS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validators
        run: |
          pip install uv
          cd themes && uv sync
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Parse-check and shellcheck scripts
        run: |
          bash -n themes/scripts/themes.sh
          shellcheck themes/scripts/themes.sh

      - name: Theme self-check
        run: ./themes/scripts/themes.sh --self-check

  desktop:
    name: Desktop (frontend + cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Svelte check
        run: npm run check
        working-directory: apps/desktop

      - name: Unit tests (catalog witnesses, theme selection, ref resolution)
        run: npm test
        working-directory: apps/desktop

      - name: No literal colours under src/
        run: npm run guard:colours
        working-directory: apps/desktop

      - name: Build frontend
        run: npm run build
        working-directory: apps/desktop

      - name: Cargo check
        run: cargo check
        working-directory: apps/desktop/src-tauri
